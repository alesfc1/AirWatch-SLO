services:
  db:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_DB: airwatch
      POSTGRES_USER: airwatch
      POSTGRES_PASSWORD: airwatch
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airwatch -d airwatch"]
      interval: 10s
      timeout: 5s
      retries: 5

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: airwatch
      DATABASE_USER: airwatch
      DATABASE_PASSWORD: airwatch
      DASH_HOST: 0.0.0.0
      DASH_PORT: 8050
    ports:
      - "8050:8050"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
